services:
  - type: web
    name: desirex-bot
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOT_TOKEN
        sync: false
      - key: DB_URL
        sync: false
      - key: IMGBB_API_KEY
        sync: false
      - key: ADMIN_IDS
        sync: false